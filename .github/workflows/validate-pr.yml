name: Validate PR
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  reimbursement-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: reimbursement_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/reimbursement_test
      REIMBURSEMENT_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/reimbursement_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: node scripts/verify-reimbursement-budgets.ts
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
          NEXT_PUBLIC_LANDING_ONLY: "true"
