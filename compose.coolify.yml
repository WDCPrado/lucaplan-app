# Aplicación Git/Docker Compose de Coolify. Secretos en Environment Variables, nunca en Git.
x-app: &app
  image: lucaplan-coolify:${SOURCE_COMMIT:?Coolify debe proporcionar el SHA}
  build:
    context: .
    args:
      NEXT_PUBLIC_LANDING_ONLY: ${NEXT_PUBLIC_LANDING_ONLY:-true}
  restart: unless-stopped
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://lucaplan:${POSTGRES_PASSWORD:?}@postgres:5432/lucaplan?schema=public
    BETTER_AUTH_URL: https://lucaplan.cl
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
    BANCOCHILE_ENC_KEY: ${BANCOCHILE_ENC_KEY:?}
    RESEND_API_KEY: ${RESEND_API_KEY:?}
    RESEND_FROM: ${RESEND_FROM:-Luca Plan <no-reply@lucaplan.cl>}
    OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:?}
    OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:?}
    OUTLOOK_TENANT: ${OUTLOOK_TENANT:-consumers}
    OUTLOOK_REDIRECT_URI: https://lucaplan.cl/api/email-connection/callback
    OUTLOOK_WEBHOOK_URL: https://lucaplan.cl/api/email-connection/webhook
    OUTLOOK_RENEW_SECRET: ${OUTLOOK_RENEW_SECRET:?}
    OUTLOOK_USER_ID: ${OUTLOOK_USER_ID:-}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    CRON_SECRET: ${CRON_SECRET:-}
    NEXT_PUBLIC_LANDING_ONLY: ${NEXT_PUBLIC_LANDING_ONLY:-true}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucaplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: lucaplan
    volumes:
      - pgdata:/var/lib/postgresql
      - /data/lucaplan/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucaplan -d lucaplan"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  cron:
    <<: *app
    command: ["node", "scripts/local-cron.mjs"]
    depends_on:
      app:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    volumes:
      - type: bind
        source: /data/lucaplan/tunnel-token
        target: /run/secrets/cloudflare_tunnel_token
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
    external: true
    name: lucaplan-production-pgdata
