name: Validate PR
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
      - run: pnpm typecheck
      - run: pnpm test
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'WDCPrado/lucaplan-app'
    runs-on: [self-hosted, Windows, X64, lucaplan-production]
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: lucaplan-production
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar servicios afectados
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/deploy-local.mjs $env:DEPLOY_SHA
