name: Validate PR
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
      - run: pnpm typecheck
      - run: pnpm test
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'WDCPrado/lucaplan-app'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    concurrency:
      group: lucaplan-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Desplegar el commit validado en Coolify
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_DATABASE_UUID: ${{ vars.COOLIFY_DATABASE_UUID }}
          COOLIFY_BACKUP_UUID: ${{ vars.COOLIFY_BACKUP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "Se omite un commit anterior a master; el más reciente debe pasar su propia validación."
            exit 0
          fi
          node scripts/deploy-coolify.mjs
